<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeoUpload — Vanilla JS Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    .upload-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: #4a90d9;
      background: #f0f7ff;
    }
    .upload-zone input { display: none; }
    .info { margin-top: 1rem; }
    progress {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      appearance: none;
    }
    progress::-webkit-progress-bar { background: #eee; border-radius: 5px; }
    progress::-webkit-progress-value { background: #4a90d9; border-radius: 5px; }
    .status { display: block; margin-top: 0.5rem; font-size: 0.9rem; color: #666; }
    .actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button {
      padding: 0.5rem 1.25rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .actions button:hover { background: #f0f0f0; }
    .actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    .actions .btn-primary { background: #4a90d9; color: white; border-color: #4a90d9; }
    .actions .btn-primary:hover { background: #3a7bc8; }
    .actions .btn-danger { color: #d32f2f; border-color: #d32f2f; }
    .chunks { margin-top: 1rem; font-size: 0.8rem; }
    .chunk-item { display: inline-block; margin: 2px; padding: 2px 6px; border-radius: 3px; }
    .chunk-done { background: #c8e6c9; color: #2e7d32; }
    .chunk-uploading { background: #fff3e0; color: #e65100; }
    .chunk-pending { background: #eee; color: #999; }
    .chunk-error { background: #ffcdd2; color: #c62828; }
    .error-msg { color: #d32f2f; margin-top: 0.5rem; font-size: 0.9rem; }
    .result { margin-top: 1rem; padding: 1rem; background: #e8f5e9; border-radius: 8px; }
    .result h3 { margin-bottom: 0.5rem; }
    .result p { font-size: 0.85rem; color: #333; margin: 0.25rem 0; }
    .config-section { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee; }
    .config-section label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; }
    .config-section input, .config-section select {
      width: 100%;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LeoUpload 文件上传演示</h1>
    <p class="subtitle">支持断点续传、断开重连、大文件分片上传</p>

    <div class="upload-zone" id="uploadZone">
      <p>📁 点击选择文件或拖拽到此处</p>
      <p style="font-size:0.8rem;color:#999;margin-top:0.5rem">支持大文件，自动分片上传</p>
      <input type="file" id="fileInput">
    </div>

    <div class="info" id="info" style="display:none">
      <progress value="0" max="100" id="progressBar"></progress>
      <span class="status" id="statusText">准备就绪</span>
      <div class="actions" id="actions">
        <button class="btn-primary" id="btnStart" disabled>开始上传</button>
        <button id="btnPause" disabled>暂停</button>
        <button id="btnResume" disabled>恢复</button>
        <button class="btn-danger" id="btnCancel" disabled>取消</button>
      </div>
      <div class="chunks" id="chunks"></div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="result" id="result" style="display:none"></div>

    <div class="config-section">
      <h3 style="font-size:1rem;margin-bottom:0.5rem">上传配置</h3>
      <label>分片大小 (MB): <input type="number" id="chunkSize" value="5" min="1" max="100"></label>
      <label>并发数: <input type="number" id="concurrency" value="3" min="1" max="10"></label>
      <label>最大重试次数: <input type="number" id="maxRetries" value="5" min="0" max="20"></label>
      <label>服务器地址:
        <select id="serverUrl">
          <option value="http://localhost:3000">Node.js (port 3000)</option>
          <option value="http://localhost:3001">Go (port 3001)</option>
          <option value="http://localhost:3002">Java (port 3002)</option>
        </select>
      </label>
    </div>
  </div>

  <script type="module">
    import { LeoUpload } from '../../packages/core/src/index.ts';

    // DOM elements
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const info = document.getElementById('info');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const chunksEl = document.getElementById('chunks');
    const errorMsg = document.getElementById('errorMsg');
    const resultEl = document.getElementById('result');
    const btnStart = document.getElementById('btnStart');
    const btnPause = document.getElementById('btnPause');
    const btnResume = document.getElementById('btnResume');
    const btnCancel = document.getElementById('btnCancel');

    let selectedFile = null;
    let uploader = null;

    function getConfig() {
      const chunkSize = parseInt(document.getElementById('chunkSize').value) * 1024 * 1024;
      const concurrency = parseInt(document.getElementById('concurrency').value);
      const maxRetries = parseInt(document.getElementById('maxRetries').value);
      const baseUrl = document.getElementById('serverUrl').value;

      return {
        chunkSize,
        concurrency,
        maxRetries,
        server: {
          init: `${baseUrl}/api/upload/init`,
          chunk: `${baseUrl}/api/upload/chunk`,
          progress: `${baseUrl}/api/upload/progress`,
          complete: `${baseUrl}/api/upload/complete`,
          cancel: `${baseUrl}/api/upload`,
        },
      };
    }

    function createUploader() {
      const config = getConfig();
      uploader = new LeoUpload(config);

      uploader.on('progress', (e) => {
        progressBar.value = e.overallProgress;
        statusText.textContent = `上传中: ${e.overallProgress}% (${e.completedChunks}/${e.totalChunks} 分片)`;
      });

      uploader.on('chunk:complete', (e) => {
        updateChunk(e.chunkIndex, 'done');
      });

      uploader.on('chunk:error', (e) => {
        updateChunk(e.chunkIndex, e.willRetry ? 'uploading' : 'error');
        if (!e.willRetry) {
          errorMsg.textContent = `分片 ${e.chunkIndex} 上传失败: ${e.error.message}`;
        }
      });

      uploader.on('chunk:retry', (e) => {
        statusText.textContent = `分片 ${e.chunkIndex} 重试中 (第${e.attempt}次)...`;
      });

      uploader.on('complete', (result) => {
        statusText.textContent = '上传完成!';
        updateButtons('completed');
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          <h3>✅ 上传成功</h3>
          <p>文件: ${result.fileName}</p>
          <p>大小: ${(result.fileSize / 1024 / 1024).toFixed(2)} MB</p>
          <p>分片: ${result.totalChunks}</p>
          <p>耗时: ${(result.durationMs / 1000).toFixed(1)}秒</p>
          <p>URL: ${result.fileUrl}</p>
        `;
      });

      uploader.on('error', (e) => {
        errorMsg.textContent = `上传失败: ${e.message}`;
        updateButtons('error');
      });

      uploader.on('pause', () => {
        statusText.textContent = '已暂停';
        updateButtons('paused');
      });

      uploader.on('cancel', () => {
        statusText.textContent = '已取消';
        updateButtons('cancelled');
      });
    }

    function updateChunk(index, status) {
      const span = document.getElementById(`chunk-${index}`);
      if (span) {
        span.className = `chunk-item chunk-${status}`;
      }
    }

    function updateButtons(state) {
      btnStart.disabled = state !== 'idle' && state !== 'error' && state !== 'cancelled';
      btnPause.disabled = state !== 'uploading';
      btnResume.disabled = state !== 'paused';
      btnCancel.disabled = state !== 'uploading' && state !== 'paused';
    }

    async function startUpload() {
      if (!selectedFile || !uploader) return;

      errorMsg.textContent = '';
      resultEl.style.display = 'none';
      info.style.display = 'block';
      progressBar.value = 0;
      statusText.textContent = '正在计算文件哈希...';

      // Initialize chunk display
      const totalChunks = Math.ceil(selectedFile.size / getConfig().chunkSize);
      chunksEl.innerHTML = Array.from({ length: totalChunks }, (_, i) =>
        `<span id="chunk-${i}" class="chunk-item chunk-pending">${i}</span>`
      ).join('');

      updateButtons('uploading');

      try {
        await uploader.start(selectedFile);
      } catch (err) {
        console.error('Upload error:', err);
      }
    }

    // Event listeners
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        selectedFile = file;
        btnStart.disabled = false;
        statusText.textContent = `已选择: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;
      }
    });

    fileInput.addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        btnStart.disabled = false;
        statusText.textContent = `已选择: ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(1)} MB)`;
        info.style.display = 'block';
      }
    });

    btnStart.addEventListener('click', () => {
      createUploader();
      startUpload();
    });

    btnPause.addEventListener('click', () => uploader?.pause());
    btnResume.addEventListener('click', () => uploader?.resume());
    btnCancel.addEventListener('click', () => uploader?.cancel());

    // Initialize
    createUploader();
  </script>
</body>
</html>
